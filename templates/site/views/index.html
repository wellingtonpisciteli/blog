{% extends 'base.html' %}
{% block conteudo %}

<div class="container my-5">
    
    <div class="row p-3">
        <div class="col-lg-9 col-md-12 ">
            <div class="row">
                {% for post in posts %}
                <div class="col-md-6 mb-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <a class="text-decoration-none text-dark" href="{{url('post/'~post.id)}}" tooltip="tooltip" title="{{post.titulo}}">
                                <h4 class="card-title">{{post.titulo}}</h4>
                                <small style="display: flex; flex-direction: row; margin-bottom: 10px; margin-top: 10px;">
                                    CATEGORIA
                                    <p style=" display: flex; position: absolute; right: 20px;">00/00/0000</p>
                                </small>
                                <p class="card-text">{{resumirTxt(post.texto, 150)}}</p>
                            </a>
                        </div>
                    </div>
                </div>    
                {%endfor %}
            </div>          
        </div>
        <div class="col-lg-3">
            {% include 'sidebar.html' %}
        </div>        
    </div>

</div>

{% endblock %}
