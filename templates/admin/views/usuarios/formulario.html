{% extends "dashboard.html" %}

{% block conteudo %} 

    <div class="container" id="container">
        <div class="opcoes" id="opcoes">
            <a class="perfil" href="#">Perfil</a>
            <a href="{{url('admin/sair')}}">Sair</a>
        </div>
        {% include 'menu2.html' %}        
        <div class="conteudo">
            {{flash()}}  
            <div class="linkHome">
                <h5 class="postsHome">
                    <a href="{{ url('admin/dashboard') }}" style="text-decoration: none; color: white;">Home</a>
                </h5>
                <h5 class="totalPosts total">
                    <a href="{{ url('admin/usuarios/listar') }}" style="text-decoration: none; color: white;">Usuários</a>
                </h5>          
            </div>

            <div class="form">
                <form action="{% if usuario.id %}{{ url('admin/usuarios/editar/'~usuario.id) }}{% else %}{{ url('admin/usuarios/cadastrar') }}{% endif %}" method="post">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input placeholder="Nome" type="text" name="nome" id="nome" class="form-control" value="{{usuario.nome}}">
                    </div>

                    <div class="categoriaEstatus">
                        <div class="select status">
                            <label for="email" class="form-label">Email</label>
                            <input placeholder="E-mail" type="email" name="email" id="email" class="form-control" value="{{usuario.email}}">
                        </div>

                        <div class="select categoria_id">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" name="senha" id="senha" class="form-control" placeholder="Senha">
                        </div>
                    </div>

                    <div class="categoriaEstatus">
                        <div class="select status">
                            <label id="status" for="status" class="form-label">
                                Status
                            </label>
                            <select name="status" id="status" class="form-select" aria-label="Default select example">
                                    <option value="0" {%if usuario.status=="0"%}selected{%endif%}>Desativado</option>
                                    <option value="1" {%if usuario.status=="1"%}selected{%endif%}>Ativado</option>
                            </select>
                        </div>

                        <div class="select categoria_id">
                            <label id="categoria_id" for="categoria_id" class="form-label">
                                Level
                            </label>
                            <select name="level" id="level" class="form-select" aria-label="Default select example">
                                <option value="1" {% if usuario.level == '1' %}selected{%endif%}>Usuário</option>
                                <option value="3" {% if usuario.level == '3' %}selected{%endif%}>Administrador</option>
                            </select>
                        </div>
                    </div>
                    <div class="btnCadastrar">
                        {% if usuario.id %}
                            <input type="submit" value="Atualizar">
                        {% else %}
                            <input type="submit" value="Cadastrar" >
                        {% endif %}
                    </div>
                </form>
            </div>
        </div>
    </div>

{% endblock %}
